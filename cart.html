<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Add these in the <head> tag -->
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Hostel Mart</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .empty-state {
      text-align: center;
      padding: 3rem;
    }
    .cart-items {
      margin-bottom: 2rem;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid #E2E8F0;
    }
    .cart-item-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .cart-item-actions input {
      width: 50px;
      padding: 0.5rem;
      border: 1px solid #E2E8F0;
      border-radius: var(--border-radius);
    }
    .remove-btn {
      cursor: pointer;
      color: var(--accent);
    }
    .summary {
      background: white;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
    }
    .summary-row.total {
      font-weight: bold;
      font-size: 1.1rem;
      border-top: 1px solid #E2E8F0;
      margin-top: 0.5rem;
      padding-top: 1rem;
    }
    .payment-options {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .payment-options button {
      flex: 1;
    }
    .qr-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .qr-content {
      background: white;
      border-radius: var(--border-radius);
      padding: 2rem;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .qr-content img {
      width: 100%;
      max-width: 300px;
      margin: 1rem auto;
    }
  </style>
</head>
<body>
  <header class="container">
    <h1>Your Cart</h1>
    <nav>
      <button onclick="location.href='index.html'">Continue Shopping</button>
    </nav>
  </header>
  
  <section class="container">
    <div id="emptyCart" class="empty-state">
      <h3>Your cart is empty</h3>
      <p>Add some delicious items to get started</p>
      <button onclick="location.href='index.html'">Browse Products</button>
    </div>
    
    <div id="cartItems" class="cart-items" style="display:none;">
      <!-- Cart items loaded via JavaScript -->
    </div>
    
    <div id="cartSummary" class="summary" style="display:none;">
      <h3>Order Summary</h3>
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="subTotal">₹0</span>
      </div>
      <div class="summary-row">
        <span>Delivery</span>
        <span>FREE</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="grandTotal">₹0</span>
      </div>
      
      <div class="payment-options">
        <button id="codBtn">Cash on Delivery</button>
        <button id="upiBtn" class="secondary">Pay via UPI</button>
      </div>
    </div>
  </section>
  
  <div class="qr-modal" id="qrModal">
    <div class="qr-content">
      <h3>Scan to Pay</h3>
      <p>Complete payment using any UPI app</p>
      <img src="https://via.placeholder.com/300x300?text=UPI+QR+Code" alt="UPI QR Code">
      <button id="paidBtn">I have paid</button>
      <button class="secondary mt-2" onclick="document.getElementById('qrModal').style.display = 'none'">Cancel</button>
    </div>
  </div>
  
  <script type="module">
    import { updateCartDisplay, updateCartCount, setupCartHandlers } from './assets/js/hostelmart.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      updateCartDisplay();
      updateCartCount();
      setupCartHandlers();
    });
  </script>
</body>
</html>
